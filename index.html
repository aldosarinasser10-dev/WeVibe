<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Book your gaming trip to Riyadh: tickets, a gaming-ready stay and a ride to the venue in one booking.">
<meta name="theme-color" content="#211762">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wevibe">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Wevibe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-sized app (full-bleed on phones, framed on desktop) + a demo navigator beside it on wide screens. Single dark look taken from the Wevibe deck. */
:root{
  color-scheme: dark;
  --bg:#211762; --bg-deep:#1a1250; --blob-a:#6f4fe0; --blob-b:#2b4d9e;
  --surface:rgba(92,74,214,.42); --surface-2:rgba(120,104,240,.30); --surface-solid:#352a93;
  --line:rgba(178,166,255,.30); --line-strong:rgba(198,188,255,.5);
  --mint:#5eebc8; --mint-ink:#1c1452; --violet:#7b5cf2; --gold:#ffc53d; --gold-ink:#3a2a00;
  --text:#ffffff; --muted:#cfc9f3; --dim:#a39bd9; --danger:#ff8a9a;
  --font:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-ar:"IBM Plex Sans Arabic", "Inter", system-ui, "Segoe UI", Tahoma, sans-serif;
  --r-lg:22px; --r-md:16px; --r-pill:999px;
}
html,body{height:100%;margin:0}
html{background:#1a1250;-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
body{background:var(--bg-deep);color:var(--text);font-family:var(--font);margin:0;-webkit-font-smoothing:antialiased;overflow:hidden}
body.ar{font-family:var(--font-ar)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .dir{transform:scaleX(-1)}

.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:20px;box-sizing:border-box;
  background:radial-gradient(60% 60% at 80% 0%, rgba(111,79,224,.35), transparent 70%),radial-gradient(50% 50% at 0% 100%, rgba(43,77,158,.35), transparent 70%),var(--bg-deep)}
.phone{position:relative;width:390px;height:min(844px,100%);border-radius:46px;overflow:hidden;background:var(--bg);
  box-shadow:0 0 0 10px #0f0a33,0 0 0 11px rgba(255,255,255,.12),0 40px 80px rgba(0,0,0,.5);isolation:isolate}
.side{width:300px;color:var(--muted);font-size:14px;line-height:1.55}
.side h2{color:var(--text);font-size:26px;margin:0 0 6px;letter-spacing:-.02em}
.side h2 b{color:var(--mint)}
.side p{margin:0 0 18px}
.side .nav{display:grid;gap:4px;margin-top:10px}
.side .nav button{text-align:start;padding:8px 12px;border-radius:10px;display:flex;gap:10px;align-items:center;color:var(--muted)}
.side .nav button:hover{background:rgba(255,255,255,.06);color:var(--text)}
.side .nav button.on{background:var(--surface);color:var(--text)}
.side .nav span{font-variant-numeric:tabular-nums;color:var(--dim);width:20px;font-size:12px}
.side .hint{margin-top:18px;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;font-size:13px}
.side .hint code{color:var(--mint);font-family:ui-monospace,Menlo,monospace}
.langsw{flex:none;display:inline-flex;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:3px}
.langsw button{padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.langsw button.on{background:var(--mint);color:var(--mint-ink)}
@media (max-width:900px){.side{display:none}}
@media (max-width:520px){
  .stage{padding:0}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none}
}

/* app background */
.bgfx{position:absolute;inset:0;z-index:-1;background:var(--bg);overflow:hidden}
.bgfx::before{content:"";position:absolute;width:420px;height:420px;right:-170px;top:-170px;border-radius:50%;background:var(--blob-a);filter:blur(60px);opacity:.85}
.bgfx::after{content:"";position:absolute;width:340px;height:420px;left:-200px;top:30%;border-radius:50%;background:var(--blob-b);filter:blur(70px);opacity:.75}

.screen{position:absolute;inset:0;overflow:hidden}
.pad{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:18px 22px 130px;display:flex;flex-direction:column;gap:18px;box-sizing:border-box}
.pad::-webkit-scrollbar{display:none}
.pad>*{flex-shrink:0}
.in{animation:slideIn .32s cubic-bezier(.2,.8,.2,1)}
.in-back{animation:slideBack .32s cubic-bezier(.2,.8,.2,1)}
.out{animation:fadeOut .25s ease forwards;pointer-events:none}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideBack{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
[dir=rtl] .in{animation-name:slideBack}[dir=rtl] .in-back{animation-name:slideIn}
@keyframes fadeOut{to{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* type */
.h1{font-size:26px;line-height:1.18;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
.h2{font-size:18px;font-weight:700;margin:0;display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}.dim{color:var(--dim)}.mint{color:var(--mint)}
.small{font-size:12.5px}.tiny{font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
body.ar .h1{letter-spacing:0;line-height:1.35}

/* atoms */
.iconbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(84,64,200,.65);border:1px solid var(--line);flex:none;transition:transform .15s}
.iconbtn:active{transform:scale(.92)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-pill);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px}
body.ar .pill{letter-spacing:0}
.pill.violet{background:var(--violet);color:#fff}
.pill.gold{background:var(--gold);color:var(--gold-ink)}
.pill.ghost{background:rgba(94,235,200,.1);color:var(--mint);border:1px solid rgba(94,235,200,.35)}
.pill.outline-gold{border:1.5px solid var(--gold);color:var(--gold)}
.stepn{width:26px;height:26px;border-radius:50%;background:var(--mint);color:var(--mint-ink);display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.sel{border:2px solid var(--mint)!important;background:rgba(70,90,210,.55)}
.ibox{width:42px;height:42px;border-radius:12px;background:rgba(150,135,255,.22);display:grid;place-items:center;color:var(--mint);flex:none}
.chk{width:26px;height:26px;border-radius:50%;background:var(--mint);color:var(--mint-ink);display:grid;place-items:center;flex:none}
.chk svg{width:15px;height:15px;stroke-width:3}
.btn-mint{background:var(--mint);color:var(--mint-ink);font-weight:700;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:space-between;gap:12px;transition:transform .15s,filter .15s}
.btn-mint:active{transform:scale(.97)}
.btn-mint .go{width:40px;height:40px;border-radius:50%;background:var(--mint-ink);color:var(--mint);display:grid;place-items:center}
.btn-line{border:1.5px solid var(--mint);border-radius:var(--r-pill);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-sm{font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;border:1.5px solid var(--mint);color:#fff;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.btn-sm.on{background:var(--mint);color:var(--mint-ink)}
.btn-sm svg{width:14px;height:14px}
.link{color:var(--mint);font-weight:700}

/* header w/ progress */
.topbar{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:10px}
.topbar .t{text-align:center;font-weight:700;font-size:17px}
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prog i{height:5px;border-radius:9px;background:rgba(120,104,240,.45)}
.prog i.on{background:var(--mint)}

/* bottom bar */
.bbar{position:absolute;left:14px;right:14px;bottom:14px;z-index:5;background:#3a2ea4;border:1px solid var(--line);border-radius:26px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 -10px 30px rgba(20,12,70,.5)}
[dir=rtl] .bbar{padding:12px 18px 12px 12px}
.bbar .lab{font-size:12px;color:var(--muted)}
.bbar .amt{font-size:21px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.bbar .sub{font-size:11px;color:var(--dim)}
.bbar .btn-mint{flex:1;max-width:190px;margin-inline-start:auto;padding:8px 8px 8px 22px;font-size:16px;min-height:56px;box-sizing:border-box}
[dir=rtl] .bbar .btn-mint{padding:8px 22px 8px 8px}
.bbar.full .btn-mint{max-width:none}

/* bottom nav */
.tabbar{position:absolute;left:22px;right:22px;bottom:16px;z-index:5;background:#3a2ea4;border:1px solid var(--line);border-radius:30px;padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tabbar button span{white-space:nowrap}
.tabbar button{min-width:0;height:50px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:14px;transition:background .2s,color .2s}
.tabbar button.on{background:var(--mint);color:var(--mint-ink);font-weight:700}

/* splash */
.splash{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 22px;text-align:center;cursor:pointer}
.logo{width:220px;height:220px;border-radius:56px;background:linear-gradient(140deg,#7b5cf2 0%,#43a3f2 50%,#5eebc8 100%);display:grid;place-items:center;color:var(--mint-ink);box-shadow:0 30px 60px rgba(20,10,80,.45);animation:float 4s ease-in-out infinite}
.logo svg{width:110px;height:110px;stroke-width:2.2}
@keyframes float{50%{transform:translateY(-8px)}}
.word{font-size:52px;font-weight:800;letter-spacing:-.03em;margin-top:34px;line-height:1}
.word b{color:var(--mint);font-weight:800}
.splash .chips{display:flex;gap:10px;margin-top:38px;flex-wrap:wrap;justify-content:center}
.splash .chips button{display:flex;align-items:center;gap:7px;padding:10px 16px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:13.5px}
.splash .chips svg{color:var(--mint);width:17px;height:17px}
.tapstart{margin-top:40px;font-size:12px;color:var(--dim);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.toplang{position:absolute;top:16px;inset-inline-end:16px;z-index:6}
.toplang .langsw button{padding:5px 11px;font-size:12px}

/* welcome */
.hero-img{border-radius:24px;overflow:hidden;aspect-ratio:1.5;max-width:100%;background:#2a2080 center/cover}
.steps{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-22px;padding-inline:22px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:0 0 31%;min-width:98px;scroll-snap-align:start;text-align:start;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-height:72px;font-size:13.5px;transition:border-color .2s}
.steps button b{color:var(--mint);font-size:13px}
.steps button.on{border-color:var(--mint)}
.stepinfo{font-size:13px;color:var(--muted);background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px;margin-top:-6px}

/* home */
.loc{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.loc svg{width:15px;height:15px;color:var(--mint)}
.dot{position:absolute;top:10px;inset-inline-end:11px;width:9px;height:9px;border-radius:50%;background:var(--gold);border:2px solid #3a2ea4}
.search{display:flex;align-items:center;gap:12px;height:54px;border-radius:999px;padding:0 18px;background:var(--surface);border:1px solid var(--line)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px}
.search input::placeholder{color:var(--dim)}
.cats{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-22px;padding-inline:22px}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;padding:10px 22px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;transition:all .2s}
.cats button.on{background:var(--mint);color:var(--mint-ink);font-weight:700;border-color:var(--mint)}
.bigcard{position:relative;border-radius:20px;overflow:hidden;min-height:210px;display:flex;align-items:flex-end;text-align:start;width:100%;background:#2a2080 center/cover;transition:transform .2s}
.bigcard:active,.smcard:active{transform:scale(.985)}
.bigcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,18,80,0) 35%,rgba(26,18,80,.92) 100%)}
.bigcard .badge{position:absolute;top:14px;inset-inline-start:14px;z-index:2}
.bigcard .favb{position:absolute;top:10px;inset-inline-end:10px;z-index:2;width:40px;height:40px}
.bigcard .row>div:first-child{min-width:0}
.bigcard .row{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;width:100%;padding:16px}
.bigcard .ttl{font-size:18px;font-weight:700;line-height:1.25}
.price{border:1px solid var(--line-strong);border-radius:14px;padding:8px 14px;text-align:center;background:rgba(40,30,120,.45);flex:none}
.price .f{font-size:11.5px;color:var(--muted)}
.price .v{font-weight:800;color:var(--mint);font-size:17px;white-space:nowrap}
.smcard{display:flex;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:start;transition:transform .2s}
.smcard .th{width:88px;height:64px;border-radius:10px;background:#2a2080 center/cover;flex:none}
.smcard .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.smcard .mid .n{font-weight:700;font-size:14.5px;line-height:1.25}
.art{background:radial-gradient(circle at 30% 20%,rgba(94,235,200,.55),transparent 55%),radial-gradient(circle at 80% 80%,rgba(123,92,242,.9),transparent 60%),linear-gradient(135deg,#2c2390,#4a2fb0);display:grid;place-items:center;color:rgba(255,255,255,.85)}
.empty{text-align:center;padding:30px 10px;color:var(--muted);display:grid;gap:10px;justify-items:center}

/* detail */
.dhero{position:relative;height:300px;margin:-18px -22px 0;background:#2a2080 center/cover}
.dhero{-webkit-mask-image:linear-gradient(180deg,#000 45%,transparent 100%);mask-image:linear-gradient(180deg,#000 45%,transparent 100%)}
.dhero .tb{-webkit-mask-image:none}
.dhero .tb{position:absolute;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;z-index:2}
.dhero .iconbtn{background:rgba(30,20,90,.7)}
.fav.on{color:#ff6b9a}.fav.on svg{fill:currentColor}
.meta{display:flex;gap:22px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.meta span{display:flex;gap:7px;align-items:center}
.meta svg{width:17px;height:17px;color:var(--mint)}
.pk{transition:border-color .25s,background .25s,opacity .25s}
.pkh{display:flex;align-items:stretch}
.pkh .prow{padding-inline-start:6px;flex:1;min-width:0}
.tgl{flex:none;display:grid;place-items:center;padding-inline-start:12px;padding-inline-end:4px}
.tgl .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line-strong);display:grid;place-items:center;color:transparent;transition:all .2s}
.tgl .box svg{width:15px;height:15px;stroke-width:3}
.tgl[aria-checked=true] .box{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
.tgl:active .box{transform:scale(.9)}
.pk.off{background:rgba(255,255,255,.04);border-style:dashed}
.pk.off .prow .ibox,.pk.off .prow .tx>span,.pk.off .prow .tx b{opacity:.55}
.inc.no{color:var(--muted);background:rgba(255,255,255,.08)}
.incchips{display:flex;gap:8px;flex-wrap:wrap}
.incchips button{display:inline-flex;gap:6px;align-items:center;padding:8px 14px;border-radius:999px;border:1.5px dashed var(--line-strong);font-size:13px;font-weight:600;color:var(--muted);transition:all .2s}
.incchips button svg{width:15px;height:15px}
.incchips button[aria-checked=true]{background:var(--mint);color:var(--mint-ink);border:1.5px solid var(--mint)}
.pk.open{border-color:rgba(94,235,200,.7);background:rgba(84,70,210,.55)}
.prow{display:flex;gap:14px;align-items:center;padding:13px 14px;width:100%;text-align:start}
.prow .tx{flex:1;min-width:0}
.prow .tx b{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.prow .tx>span{font-size:12.5px;color:var(--muted)}
.inc{font-style:normal;display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--mint);background:rgba(94,235,200,.12);border-radius:999px;padding:2px 8px 2px 6px;letter-spacing:.02em}
.inc svg{width:11px;height:11px;stroke-width:3}
.more{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none}
.more .cnt{font-size:10.5px;color:var(--dim);white-space:nowrap}
.more .chev{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--mint);color:var(--mint);display:grid;place-items:center;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .25s,color .25s}
.more .chev svg{width:16px;height:16px;stroke-width:2.6}
.pk.open .chev{transform:rotate(180deg);background:var(--mint);color:var(--mint-ink)}
.pexp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1)}
.pk.open .pexp{grid-template-rows:1fr}
.pexp .pin{overflow:hidden;min-height:0;margin:0 12px;display:grid}
.pk.open .pexp .pin{margin-bottom:12px}
.po{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);font-size:13px}
.po .pi{width:28px;height:28px;border-radius:8px;background:rgba(150,135,255,.22);color:var(--mint);display:grid;place-items:center;flex:none}
.po .pi svg{width:15px;height:15px}
.po .pt{flex:1;min-width:0;display:grid;gap:1px}
.po .pt span{font-size:11.5px;color:var(--muted)}
.po .pp{color:var(--mint);white-space:nowrap;font-size:13.5px}
.pnote{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);padding:8px 4px 0;border-top:1px solid var(--line)}
.pnote svg{width:13px;height:13px}
.perk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--gold);background:rgba(255,197,61,.08);font-size:12.5px}
.perk .ib{width:32px;height:32px;border-radius:9px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;flex:none}
.perk .ib svg{width:17px;height:17px}
.perk b{color:var(--gold)}

/* pack */
.tix{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tix button{position:relative;text-align:start;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-height:96px;transition:all .2s}
.tix button b{font-size:15.5px}
.tix button .pr{margin-top:auto;font-weight:700}
.tix button.sel .pr,.tix button.sel b{color:var(--mint)}
.tix .best{position:absolute;top:-11px;inset-inline-end:12px}
.hotel{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);transition:all .2s;cursor:pointer}
.hotel .tx{flex:1;min-width:0}
.hotel .tx b{font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hotel .rt{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:2px;font-weight:600}
.hotel .rt svg{width:13px;height:13px;color:var(--gold);fill:var(--gold);stroke:none}
.hotel .pinb{color:var(--mint);padding:4px}
.hotel .pinb svg{width:18px;height:18px}
.rides{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rides button{padding:14px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;transition:all .2s;font-size:13px}
.rides button svg{color:var(--mint);width:24px;height:24px}
.rides button b{font-size:13px}

/* dates */
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:8px}
.cal button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;font-size:13px;color:var(--muted);transition:background .2s}
.cal button b{font-size:21px;color:#fff;font-weight:700}
.cal button.rng{background:rgba(110,92,235,.55)}
.cal button.end{background:var(--mint);color:var(--mint-ink);border-radius:16px;position:relative;z-index:1}
.cal button.end b{color:var(--mint-ink)}
.cal button:disabled{opacity:.35;cursor:default}
.cal .evb{grid-row:2;display:flex;justify-content:center}
.evbox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.evbox div{padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.evbox span{font-size:12.5px;color:var(--muted)}
.evbox b{display:block;margin-top:6px;font-size:15px}
.note{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.note svg{width:16px;height:16px;color:var(--mint)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.stepper .m{border:1.5px solid #fff}
.stepper .p{background:var(--mint);color:var(--mint-ink)}
.stepper button:disabled{opacity:.35}
.stepper b{font-size:19px;min-width:16px;text-align:center}
.info{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:14px;border:1.5px solid var(--mint);background:rgba(94,235,200,.06);font-size:12.5px;line-height:1.45}
.info svg{width:17px;height:17px;color:var(--mint);margin-top:1px}

/* plan */
.day{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.day.ev{border:2px solid var(--mint)}
.day .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:14px}
.day .dh b{color:var(--mint);letter-spacing:.04em}
.it{display:flex;gap:12px;align-items:center;padding:6px 0;position:relative}
.it .ibox{width:34px;height:34px;border-radius:10px}
.it .ibox svg{width:17px;height:17px}
.it .tx{flex:1;min-width:0;font-size:12px;color:var(--muted);line-height:1.35}
.it .tx b{color:#fff;font-size:14px}
.it .tx .tm{color:var(--mint);font-weight:700;font-size:12px;margin-inline-end:6px}
.it .rm{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
.it .rm svg{width:15px;height:15px}
.addact{border:2px dashed rgba(94,235,200,.6);border-radius:999px;padding:16px;color:var(--mint);font-weight:600;font-size:14px;display:flex;justify-content:center;gap:8px;align-items:center}
.addact svg{width:16px;height:16px}

/* pay */
.lines{padding:16px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.lines .l{display:flex;justify-content:space-between;gap:10px}
.lines .l b{white-space:nowrap}
.lines hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.lines .tot{font-size:17px;font-weight:700;align-items:center}
.lines .tot b{color:var(--mint);font-size:22px}
.lines .disc{color:var(--mint)}
.promo{display:flex;align-items:center;gap:10px;height:52px;border-radius:999px;padding:0 6px 0 16px;background:var(--surface);border:1px solid var(--line)}
[dir=rtl] .promo{padding:0 16px 0 6px}
.promo.bad{border-color:var(--danger)}
.promo.good{border-color:var(--mint)}
.promo svg{color:var(--muted)}
.promo input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14px;text-transform:uppercase}
.promo input::placeholder{text-transform:none;color:var(--muted)}
.promo button{background:var(--mint);color:var(--mint-ink);font-weight:700;padding:10px 20px;border-radius:999px}
.pmsg{font-size:12px;margin-top:-10px;padding-inline:16px}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pays button{position:relative;padding:16px 6px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);transition:all .2s}
.pays button svg{color:#fff;width:24px;height:24px}
.pays button b{color:#fff;font-size:14px}
.pays .best{position:absolute;top:-11px}
.cardform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cardform label{min-width:0;display:grid;gap:5px;font-size:12px;color:var(--muted)}
.cardform label.full{grid-column:1/-1}
.cardform input{width:100%;min-width:0;box-sizing:border-box;height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);padding:0 14px;outline:0;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.cardform input.bad{border-color:var(--danger)}
.fine{text-align:center;font-size:11.5px;color:var(--dim);line-height:1.6}
.fine button{color:var(--muted);text-decoration:underline}
.secure{display:flex;justify-content:center;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.secure svg{width:16px;height:16px;color:var(--mint)}

/* done */
.okc{width:58px;height:58px;border-radius:50%;background:var(--mint);color:var(--mint-ink);display:grid;place-items:center;margin:8px auto 0;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.okc svg{width:28px;height:28px;stroke-width:2.6}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.ticket{position:relative;border-radius:22px;background:#3c2fa6;border:1px solid var(--line);padding:18px 18px 16px}
.ticket .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ticket .hd b{font-size:15.5px}
.trow{display:flex;gap:12px;align-items:center;padding:7px 0}
.trow .ibox{width:34px;height:34px;border-radius:50%;background:rgba(150,135,255,.28)}
.trow .ibox.g{background:#5a4318;color:var(--gold)}
.trow .ibox svg{width:17px;height:17px}
.trow .tx{font-size:12px;color:var(--muted)}
.trow .tx b{display:block;color:#fff;font-size:14px}
.perf{position:relative;border-top:1.5px dashed var(--line-strong);margin:12px -18px 16px}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.perf::before{left:-11px}.perf::after{right:-11px}
.qrw{display:flex;gap:16px;align-items:center}
.qrw canvas{width:92px;height:92px;border-radius:8px;background:#fff;flex:none;image-rendering:pixelated}
.qrw .bid{font-size:23px;font-weight:800;letter-spacing:.02em;margin:3px 0}
.bigbtn{min-height:56px;font-size:16px;padding:8px 8px 8px 24px;width:100%;box-sizing:border-box}
[dir=rtl] .bigbtn{padding:8px 24px 8px 8px}
.btn-line.bigbtn{padding:0;justify-content:center}

/* trips + profile */
.trip{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:start;width:100%}
.trip .th{width:64px;height:64px;border-radius:12px;background:#2a2080 center/cover;flex:none}
.trip .tx{flex:1;min-width:0;font-size:12.5px;color:var(--muted);display:grid;gap:3px}
.trip .tx b{color:#fff;font-size:14.5px}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(140deg,#7b5cf2,#43a3f2 50%,#5eebc8);display:grid;place-items:center;color:var(--mint-ink);font-weight:800;font-size:26px;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:center;font-size:12px;color:var(--muted)}
.stats b{display:block;font-size:20px;color:#fff}
.list{border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.list .li{box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:start;font-size:14.5px}
.list .li+.li{border-top:1px solid var(--line)}
.list .li .grow{flex:1}
.list .li svg{color:var(--mint)}
.sw{width:46px;height:28px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--mint)}
.sw.on::after{transform:translateX(18px)}
[dir=rtl] .sw.on::after{transform:translateX(-18px)}

/* sheet + toast + overlay */
.scrim{position:absolute;inset:0;background:rgba(10,6,40,.6);z-index:20;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:#2d2390;border-top:1px solid var(--line-strong);border-radius:28px 28px 0 0;padding:10px 22px 28px;max-height:82%;overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px}
.sheet.show{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.3);margin:0 auto 4px}
.sheet .sh{display:flex;justify-content:space-between;align-items:center}
.sheet .sh .iconbtn{width:36px;height:36px}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:start}
.opt .tx{flex:1;min-width:0;font-size:12.5px;color:var(--muted)}
.opt .tx b{display:block;color:#fff;font-size:14.5px}
.daychips{display:flex;gap:8px;flex-wrap:wrap}
.daychips button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.daychips button.on{background:var(--mint);color:var(--mint-ink);border-color:var(--mint);font-weight:700}
.field{display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.field input{height:52px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);padding:0 16px;outline:0;font-size:16px}
.otp{display:flex;gap:10px;justify-content:center;direction:ltr}
.otp input{width:54px;height:60px;text-align:center;font-size:24px;font-weight:700;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);outline:0}
.otp input:focus{border-color:var(--mint)}
.toast{pointer-events:none;position:absolute;left:50%;top:18px;z-index:40;transform:translate(-50%,-120px);background:#fff;color:var(--mint-ink);font-weight:600;font-size:13.5px;padding:11px 18px;border-radius:999px;display:flex;gap:8px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.2,1.2,.4,1);max-width:calc(100% - 40px);box-sizing:border-box}
.toast.show{transform:translate(-50%,0)}
.toast svg{width:17px;height:17px;color:#16a37f}
.overlay{position:absolute;inset:0;z-index:30;background:rgba(26,18,80,.92);display:grid;place-content:center;justify-items:center;gap:16px;text-align:center;font-weight:600}
.spin{width:54px;height:54px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--mint);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.notif{display:flex;gap:12px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.notif b{display:block;color:#fff;font-size:14px;margin-bottom:2px}
/* safe areas (notch / home indicator) when running full-screen */
.pad{padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
.bbar{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.tabbar{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.toplang{top:calc(16px + env(safe-area-inset-top,0px))}
.toast{top:calc(18px + env(safe-area-inset-top,0px))}
.sheet{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.dhero{margin-top:calc(-18px - env(safe-area-inset-top,0px));height:calc(300px + env(safe-area-inset-top,0px))}
.dhero .tb{top:calc(18px + env(safe-area-inset-top,0px))}
.splash{padding-top:env(safe-area-inset-top,0px)}
@media (display-mode:standalone){
  .stage{padding:0}
  .side{display:none}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none}
}
/* narrow phones (Galaxy Fold, iPhone SE) */
@media (max-width:360px){
  .pad{padding-left:16px;padding-right:16px}
  .cats,.steps{margin-inline:-16px;padding-inline:16px}
  .dhero{margin-inline:-16px}
  .h1{font-size:23px}
  .tabbar{left:12px;right:12px}
  .tabbar button:not(.on) span{display:none}
  .bbar{left:10px;right:10px}
  .bbar .amt{font-size:18px}
  .bbar .btn-mint{font-size:14.5px;padding-inline-start:16px}
  .smcard .th{width:60px;height:56px}
  .price{padding:6px 10px}.price .v{font-size:15px}
  .bigcard .ttl{font-size:16px}
  .tix{gap:8px}.rides,.pays{gap:8px}
  .cal button b{font-size:18px}.cal button{font-size:11.5px}
  .word{font-size:44px}.logo{width:180px;height:180px;border-radius:46px}
  .hotel .ibox{display:none}
  .hotel{gap:8px}
}
@media (max-width:300px){
  .smcard{flex-wrap:wrap}.smcard .mid{flex-basis:calc(100% - 72px)}.smcard .price{margin-inline-start:72px}
  .bigcard .row{flex-direction:column;align-items:flex-start}
  .rides,.pays{grid-template-columns:1fr 1fr 1fr}.rides button b,.pays button b{font-size:12px}
  .tix{grid-template-columns:1fr}
  .bbar .lab,.bbar .sub{display:none}
  .hotel .btn-sm{font-size:0;gap:0;padding:7px}
  .hotel .btn-sm svg{width:15px;height:15px}
}
@media (max-height:560px) and (min-width:521px){
  .stage{padding:0}
  .side{display:none}
  .phone{width:min(100%,480px);height:100%;border-radius:0;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
}
</style>

</head>

  <aside class="side" id="side"></aside>
  <div class="phone" id="app" dir="ltr">
    <div class="bgfx"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

/* ---------- helpers ---------- */
const EV = (id=S.eventId) => EVENTS.find(e=>e.id===id);
const addDays = (iso,n) => { const d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const diff = (a,b) => Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/864e5);
const loc = () => S.lang==='ar' ? 'ar-u-ca-gregory-nu-latn' : 'en-US';
const fmt = (iso,o) => new Intl.DateTimeFormat(loc(),{timeZone:'UTC',...o}).format(new Date(iso+'T12:00:00Z'));
const md = iso => fmt(iso,{month:'short',day:'numeric'});
const wmd = iso => fmt(iso,{weekday:'short',month:'short',day:'numeric'});
const tm = hhmm => { let [h,m]=hhmm.split(':').map(Number); const pm=h>=12; h=h%12||12; return `${h}:${String(m).padStart(2,'0')} ${S.lang==='ar'?(pm?'م':'ص'):(pm?'PM':'AM')}`; };
const money = (n,dec=0) => { const s = Number(n).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}); return S.lang==='ar' ? `${s} ر.س` : `SAR ${s}`; };
const plural = (k,n) => n===1 ? t(k+'_n',{n}) : (n===2 && k==='nights' && S.lang==='ar') ? t('nights_2',{n}) : t(k+'_np',{n});
const INC = () => S.inc;
const incCount = () => ['ticket','stay','ride'].filter(k=>S.inc[k]).length;
const fromPrice = (e, inc={ticket:true,stay:true,ride:true}) => (inc.ticket?e.prices.standard:0) + (inc.stay?Math.min(...Object.values(HOTELS).map(h=>h.price)):0) + (inc.ride?RIDES.shuttle.price:0);
const summary = () => plural('guests',S.guests) + (S.inc.stay ? ' · ' + plural('nights',nights()) : '');
const bgImg = k => k ? `background-image:url(${IMG[k]})` : '';
function ensureDates(){ const e=EV(); if(!S.checkin){ S.checkin=e.date; S.checkout=addDays(e.date,1);} }
const nights = () => S.inc.stay ? diff(S.checkin,S.checkout) : 0;
const days = () => { if(!S.inc.stay) return [EV().date]; const out=[]; for(let i=0;i<=nights();i++) out.push(addDays(S.checkin,i)); return out; };

function calc(){
 ensureDates();
 const e=EV(), n=nights();
 const lines=[];
 if(S.inc.ticket) lines.push({k:'ticket', label:`${S.ticket==='vip'?t('vipticket'):t('stdticket')} × ${S.guests}`, v:e.prices[S.ticket]*S.guests});
 if(S.inc.stay) lines.push({k:'hotel', label:`${tx(HOTELS[S.hotel].name)} · ${plural('nights',n)}`, v:HOTELS[S.hotel].price*n});
 if(S.inc.ride) lines.push({k:'ride', label:tx(RIDES[S.ride].name), v:RIDES[S.ride].price});
 const dset=new Set(days());
 for(const d in S.acts) if(dset.has(d)) for(const a of S.acts[d]) lines.push({k:'act', label:`${tx(ACTS[a].name)} × ${S.guests}`, v:ACTS[a].price*S.guests});
 const sub=lines.reduce((s,l)=>s+l.v,0);
 let disc=0; if(S.promo){ const p=PROMOS[S.promo]; disc = p.type==='pct' ? Math.round(sub*p.v/100) : p.v; }
 const total=sub-disc;
 return {lines, sub, disc, total, vat:Math.round(total*15/115)};
}

function dayItems(d){

 if(I.ride && S.ride==='airport' && d===(I.stay?S.checkin:e.date)) items.push({time:'13:00', icon:'plane', title:t('airportp'), sub:I.stay?t('airportp_s'):t('airportv',{v:tx(e.venue)})});
 if(I.stay && d===S.checkin) items.push({time:'15:00', icon:'bed', title:t('hcheckin'), sub:tx(HOTELS[S.hotel].name)});
 if(d===e.date){
  const rideT = S.ride==='shuttle'?t('shuttlev'):S.ride==='car'?t('carv'):t('ridev');
  const [h,m]=e.time.split(':').map(Number);
  const pad=n=>String(n).padStart(2,'0');
  if(I.ride && !(S.ride==='airport' && !I.stay)) items.push({time:`${pad(h-3)}:${pad(m)}`, icon:S.ride==='car'?'car':'bus', title:rideT, sub:t(I.stay?'lobby':'pickupv',{v:tx(e.venue)})});
  if(I.ticket && S.ticket==='vip') items.push({time:`${pad(h-1)}:30`, icon:'camera', title:t('meet'), sub:t('meet_s'), vip:true});
  items.push({time:e.time, icon:'gamepad', title:tx(e.name), sub:!I.ticket?t('noticket'):S.ticket==='vip'?t('vipgate'):t('gengate')});
 }
 if(I.stay && d===S.checkout) items.push({time:'12:00', icon:'exit', title:t('hcheckout'), sub:I.ride&&S.ride==='shuttle'?t('shuttleback'):t('latecheck')});
 const added=S.acts[d]||[];
 const sug = !I.stay ? null : d===S.checkout ? 'arcade' : d===S.checkin && d!==e.date ? 'citynight' : d!==e.date ? 'vr' : null;
 if(sug && !added.includes(sug)) items.push({time:ACTS[sug].time, icon:ACTS[sug].icon, title:tx(ACTS[sug].name), sub:`${t('suggested')} · ${money(ACTS[sug].price)} ${t('pp')}`, sug, d});

 return items.sort((a,b)=>a.time.localeCompare(b.time));

/* ---------- QR (decorative, seeded by booking id) ---------- */
function drawQR(id){
 const c=document.getElementById('qr'); if(!c) return; const x=c.getContext('2d'), N=29;
 x.fillStyle='#fff'; x.fillRect(0,0,N,N); x.fillStyle='#1c1452';
 let s=0; for(const ch of id) s=(s*31+ch.charCodeAt(0))>>>0;
 const rnd=()=>{ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; };
 const finder=(ox,oy)=>{ for(let i=0;i<7;i++)for(let j=0;j<7;j++){ const edge=i===0||i===6||j===0||j===6, core=i>=2&&i<=4&&j>=2&&j<=4; if(edge||core) x.fillRect(ox+i,oy+j,1,1);} };
 const inF=(i,j)=>(i<9&&j<9)||(i>N-10&&j<9)||(i<9&&j>N-10);
 for(let i=1;i<N-1;i++)for(let j=1;j<N-1;j++) if(!inF(i,j) && rnd()<.5) x.fillRect(i,j,1,1);
 finder(1,1); finder(N-8,1); finder(1,N-8);
}

const app = document.getElementById('app');
let cur = null;
function build(route){ const el=document.createElement('div'); el.className='screen'; el.innerHTML=SCREENS[route](); return el; }
function after(){ if(S.route==='done'||S.route==='ticket'){ const b = S.route==='ticket' ? (S.trips.find(x=>x.id===S.view)||S.last) : S.last; drawQR((b||{id:'WV-00000'}).id); } }
function render(){ // in place, keep scroll
 const sc = cur && cur.querySelector('.pad'); const top = sc ? sc.scrollTop : 0;
 const el = build(S.route); if(cur) cur.replaceWith(el); else app.appendChild(el); cur=el; const ns=cur.querySelector('.pad'); if(ns) ns.scrollTop=top; after(); renderSide();
}
function go(route, back=false){
 if(!SCREENS[route]) route='home';
 if(route==='dates' && !S.datesTouched){ const e=EV(); S.checkin=addDays(e.date,-1); S.checkout=addDays(e.date,1); }
 if(route==='done' && !S.last) S.last = makeBooking();
 if(!back && S.route!==route && S.route!=='splash') S.stack.push(S.route);
 S.route=route;
 const el=build(route); el.classList.add(back?'in-back':'in');
 const old=cur; app.appendChild(el); cur=el;
 if(old){ old.classList.add('out'); setTimeout(()=>old.remove(),260); }
 after(); renderSide(); closeSheet(true);
 if(location.hash.slice(1)!==route){ try{ history.replaceState(null,'','#'+route); }catch(e){ location.hash=route; } }
}
function back(){ const r=S.stack.pop() || 'home'; go(r,true); }

function setLang(l){
 S.lang=l; store.save();
 app.setAttribute('dir', l==='ar'?'rtl':'ltr'); document.body.classList.toggle('ar', l==='ar');
 document.documentElement.lang = l; document.getElementById('side').setAttribute('dir', l==='ar'?'rtl':'ltr');
 render();
}

/* ---------- toast / sheet / overlay ---------- */
let tt;
function toast(msg){ const el=document.getElementById('toast'); el.innerHTML=ic('check')+`<span>${msg}</span>`; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2200); }
let sheetEl=null, scrimEl=null;
function openSheet(title, body){
 closeSheet(true);
 scrimEl=document.createElement('div'); scrimEl.className='scrim'; scrimEl.dataset.a='closesheet';
 sheetEl=document.createElement('div'); sheetEl.className='sheet'; sheetEl.setAttribute('role','dialog'); sheetEl.setAttribute('aria-modal','true');
 sheetEl.innerHTML=`<div class="grab"></div><div class="sh"><h2 class="h2">${title}</h2><button class="iconbtn" data-a="closesheet" aria-label="Close">${ic('x')}</button></div><div class="sb" style="display:grid;gap:12px">${body}</div>`;
 app.append(scrimEl, sheetEl);
 requestAnimationFrame(()=>{ scrimEl.classList.add('show'); sheetEl.classList.add('show'); });
}
function setSheetBody(body){ if(sheetEl) sheetEl.querySelector('.sb').innerHTML=body; }
function closeSheet(now){
 if(!sheetEl) return; const s=sheetEl, c=scrimEl; sheetEl=scrimEl=null;
 if(now){ s.remove(); c.remove(); return; }
 s.classList.remove('show'); c.classList.remove('show'); setTimeout(()=>{s.remove();c.remove();},320);
}

/* ---------- booking ---------- */
function makeBooking(){
 ensureDates(); const c=calc();
 return {id:'WV-'+(20000+Math.floor(Math.random()*79999)), eventId:S.eventId, ticket:S.ticket, guests:S.guests, checkin:S.checkin, checkout:S.checkout, hotel:S.hotel, ride:S.ride, inc:{...S.inc}, total:c.total};
}
function resetTrip(){ Object.assign(S,{ticket:'vip',hotel:'diriyah',ride:'shuttle',guests:1,checkin:null,checkout:null,datesTouched:false,acts:{},promo:null,promoIn:'',promoErr:false,pay:'apple',card:{no:'',exp:'',cvv:''},cardErr:false,calAdded:false,packOpen:-1,inc:{ticket:true,stay:true,ride:true}}); }

/* ---------- sheets content ---------- */
function actSheetBody(sel){
 const ds=days(); sel = sel || S._actDay || (ds.find(d=>d!==EV().date) || ds[0]); S._actDay=sel;
 return `
  <div class="small muted">${t('addto')}</div>
  <div class="daychips">${ds.map((d,i)=>`<button class="${d===sel?'on':''}" data-a="actday" data-v="${d}">${t('day',{n:i+1})} · ${md(d)}</button>`).join('')}</div>
  <div class="small muted">${t('acts')}</div>
  ${Object.entries(ACTS).map(([k,a])=>{ const has=(S.acts[sel]||[]).includes(k); return `
   <div class="opt"><span class="ibox">${ic(a.icon)}</span><span class="tx"><b>${tx(a.name)}</b>${tm(a.time)} · ${money(a.price)} ${t('pp')}</span>
   ${has?`<button class="btn-sm on" data-a="actrm" data-v="${sel}|${k}">${ic('check')}${t('added')}</button>`:`<button class="btn-sm" data-a="actadd" data-v="${sel}|${k}">${ic('plus')}${t('add')}</button>`}</div>`; }).join('')}
  ${S.inc.stay?'':'<!--'}<button class="opt" data-a="addday"><span class="ibox">${ic('calplus')}</span><span class="tx"><b>${t('addday')}</b>${t('addday_s')} · +${money(HOTELS[S.hotel].price)}</span>${ic('plus')}</button>${S.inc.stay?'':'-->'}`;
}
function signinBody(step, err){
 if(step===2) return `
  <div class="small muted">${t('entercode',{p:'<span dir="ltr">+966 '+esc(S._phone)+'</span>'})}</div>
  <div class="otp">${[0,1,2,3].map(i=>`<input id="otp${i}" inputmode="numeric" maxlength="1" aria-label="Digit ${i+1}">`).join('')}</div>
  <div class="tiny dim" style="text-align:center">${t('democode')}</div>
  <button class="btn-mint bigbtn" data-a="verify">${t('verify')}<span class="go">${ic('arrow')}</span></button>`;
 return `
  <label class="field">${t('name_l')}<input id="sname" value="${esc(S._name||'')}" autocomplete="given-name"></label>
  <label class="field">${t('phone_l')}<div style="display:flex;gap:8px;direction:ltr"><input value="+966" disabled style="width:80px;opacity:.7"><input id="sphone" inputmode="numeric" placeholder="5X XXX XXXX" value="${esc(S._phone||'')}" style="flex:1;min-width:0;${err?'border-color:var(--danger)':''}" autocomplete="tel-national"></div></label>
  ${err?`<div class="small" style="color:var(--danger)">${t('phoneerr')}</div>`:''}
  <button class="btn-mint bigbtn" data-a="sendcode">${t('sendcode')}<span class="go">${ic('arrow')}</span></button>`;
}

/* ---------- events ---------- */
app.addEventListener('click', onClick);
document.getElementById('side').addEventListener('click', onClick);
function onClick(ev){
 const el = ev.target.closest('[data-a]'); if(!el) return;
 const a=el.dataset.a, v=el.dataset.v;
 ev.stopPropagation();
 switch(a){
  case 'go': go(v); break;
  case 'jump': S.stack=[]; if(['event','pack','dates','plan','pay'].includes(v)) S.stack=['home']; if(v==='done') S.last=null; go(v); break;
  case 'back': back(); break;
  case 'tab': S.stack=[]; go(v); break;
  case 'lang': setLang(v); break;
  case 'step': S.step=+v; render(); break;
  case 'cat': S.cat=v; S.q=''; render(); break;
  case 'event': if(S.eventId!==v){ resetTrip(); S.eventId=v; } go('event'); break;
  case 'fav': S.fav[v]=!S.fav[v]; if(!S.fav[v]) delete S.fav[v]; store.save(); toast(S.fav[v]?t('saved_t'):t('unsaved')); render(); break;
  case 'packrow': S.packOpen = S.packOpen===+v ? -1 : +v;
    cur.querySelectorAll('.pk').forEach(c=>{ const on=+c.dataset.i===S.packOpen; c.classList.toggle('open',on); c.querySelector('.prow').setAttribute('aria-expanded',on); });
    break;
  case 'incl': { S.inc[v]=!S.inc[v]; if(!incCount()){ S.inc[v]=true; toast(t('keepone')); break; }
    if(v==='stay' && S.inc.stay && S.route==='dates' && !S.datesTouched){ const e=EV(); S.checkin=addDays(e.date,-1); S.checkout=addDays(e.date,1); }
    render(); break; }
  case 'ticket': S.ticket=v; render(); break;
  case 'hotel': S.hotel=v; render(); break;
  case 'hotelinfo': { const h=HOTELS[v]; openSheet(tx(h.name), `
    <div class="small muted" style="display:flex;gap:12px;align-items:center"><span class="rt" style="display:inline-flex;gap:4px;align-items:center;color:#fff;font-weight:700">${ic('star').replace('class="i','style="width:15px;height:15px;fill:var(--gold);stroke:none" class="i')}${h.rating}/5</span> · ${t('away',{n:h.min})} · ${money(h.price)} / ${t('night')}</div>
    <div class="small muted">${t('amen')}</div>
    ${['am1','am2','am3','am4'].map(k=>`<div class="note" style="font-size:14px;color:#fff">${ic('check')}${t(k)}</div>`).join('')}
    <button class="btn-mint bigbtn" data-a="pickhotel" data-v="${v}">${t('choosestay')}<span class="go">${ic('arrow')}</span></button>`); break; }
  case 'pickhotel': S.hotel=v; closeSheet(); render(); break;
  case 'ride': S.ride=v; render(); break;
  case 'day': { const e=EV(); S.datesTouched=true;
    if(v<=e.date) S.checkin=v; else S.checkout=v;
    // drop activities outside the new range
    const ds=new Set(days()); for(const d in S.acts) if(!ds.has(d)) delete S.acts[d];
    render(); break; }
  case 'guests': S.guests=Math.max(1,Math.min(4,S.guests+(+v))); render(); break;
  case 'actadd': { const [d,k]=v.split('|'); (S.acts[d]=S.acts[d]||[]); if(!S.acts[d].includes(k)) S.acts[d].push(k); render(); if(sheetEl) setSheetBody(actSheetBody(d)); toast(t('actadded',{a:tx(ACTS[k].name),d:md(d)})); break; }
  case 'actrm': { const [d,k]=v.split('|'); S.acts[d]=(S.acts[d]||[]).filter(x=>x!==k); render(); if(sheetEl) setSheetBody(actSheetBody(d)); break; }
  case 'actsheet': S._actDay=null; openSheet(t('addact'), actSheetBody()); break;
  case 'actday': setSheetBody(actSheetBody(v)); break;
  case 'addday': { const e=EV(); S.datesTouched=true;
    if(diff(e.date,S.checkout)<3) S.checkout=addDays(S.checkout,1);
    else if(diff(S.checkin,e.date)<3) S.checkin=addDays(S.checkin,-1);
    else { toast(t('maxday')); break; }
    render(); setSheetBody(actSheetBody(S._actDay)); toast(t('dayadded')); break; }
  case 'promo': { const inp=document.getElementById('promo'); const code=(inp?inp.value:S.promoIn).trim().toUpperCase();
    if(PROMOS[code]){ S.promo=code; S.promoErr=false; S.promoIn=''; toast(t('promo_ok',{c:code})); } else { S.promoErr=true; S.promoIn=code; }
    render(); break; }
  case 'promorm': S.promo=null; render(); break;
  case 'paym': S.pay=v; S.cardErr=false; render(); break;
  case 'terms': openSheet(t('terms'), `<p class="muted" style="margin:0;line-height:1.6;font-size:14px">${t('terms_b')}</p><button class="btn-line bigbtn" data-a="closesheet">${t('gotit')}</button>`); break;
  case 'dopay': {
    if(S.pay==='mada'){ const ok = S.card.no.replace(/\s/g,'').length===16 && /^(0[1-9]|1[0-2])\/\d\d$/.test(S.card.exp) && /^\d{3}$/.test(S.card.cvv); if(!ok){ S.cardErr=true; render(); break; } }
    const ov=document.createElement('div'); ov.className='overlay'; ov.innerHTML=`<div class="spin"></div><div>${t('processing')}</div>`; app.appendChild(ov);
    setTimeout(()=>{ S.last=makeBooking(); S.trips.unshift(S.last); store.save(); ov.remove(); S.stack=[]; go('done'); }, 1600);
    break; }
  case 'calsheet': { const b = S.route==='ticket' ? (S.trips.find(x=>x.id===S.view)||S.last) : S.last; const e=EV(b.eventId);
    const dt=e.date.replace(/-/g,''), [h,m]=e.time.split(':');
    // Riyadh is UTC+3: the calendar entry runs from the ride (3h before start) to the end of the event (3h after start)
    const base=Date.UTC(+dt.slice(0,4), +dt.slice(4,6)-1, +dt.slice(6,8), +h-3, +m), z=ms=>new Date(ms).toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
    const st=z(base-3*36e5), en=z(base+3*36e5);
    const url=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(tx(e.name))}&dates=${st}/${en}&location=${encodeURIComponent(tx(e.venue)+', Riyadh')}&details=${encodeURIComponent('Wevibe booking '+b.id)}`;
    openSheet(t('addcal'), `
     <a class="opt" href="${url}" target="_blank" rel="noopener" data-a="caldone" style="text-decoration:none;color:inherit"><span class="ibox">${ic('cal')}</span><span class="tx"><b>${t('gcal')}</b>${t('gcal_s')}</span>${ic('chev')}</a>
     <button class="opt" data-a="copytrip"><span class="ibox">${ic('copy')}</span><span class="tx"><b>${t('copydet')}</b>${t('copydet_s')}</span>${ic('chev')}</button>`); break; }
  case 'caldone': S.calAdded=true; setTimeout(()=>{ closeSheet(); render(); toast(t('addedcal')); },50); return; // let the link open
  case 'copytrip': { const b = S.route==='ticket' ? (S.trips.find(x=>x.id===S.view)||S.last) : S.last; const e=EV(b.eventId);
    const txt=`${tx(e.name)} — ${wmd(e.date)} ${tm(e.time)}, ${tx(e.venue)}\n${tx(HOTELS[b.hotel].name)}: ${wmd(b.checkin)} → ${wmd(b.checkout)}\n${t('bookingid')}: ${b.id}`;
    const ok=()=>{ S.calAdded=true; closeSheet(); render(); toast(t('copied')); };
    try{ navigator.clipboard.writeText(txt).then(ok, ok); }catch(e){ ok(); } break; }
  case 'finish': resetTrip(); S.stack=[]; go('home'); break;
  case 'viewtrip': S.view=v; S.calAdded=false; go('ticket'); break;
  case 'bell': S.bell=false; render(); openSheet(t('notifs'), [['n1','n1s','trophy'],['n2','n2s','gamepad'],['n3','n3s','tag']].map(([a,b,i])=>`<div class="notif"><span class="ibox">${ic(i)}</span><div><b>${t(a)}</b>${t(b)}</div></div>`).join('')); break;
  case 'city': openSheet(t('chcity'), `
    <button class="opt sel" data-a="closesheet"><span class="ibox">${ic('pin')}</span><span class="tx"><b>${t('riyadh')}</b>${t('city')}</span>${ic('check')}</button>
    ${['jeddah','dammam'].map(c=>`<div class="opt" style="opacity:.55"><span class="ibox">${ic('pin')}</span><span class="tx"><b>${t(c)}</b>${t('soon')}</span></div>`).join('')}`); break;
  case 'signin': openSheet(t('signin_t'), signinBody(1)); break;
  case 'sendcode': { S._name=(document.getElementById('sname').value||'').trim(); S._phone=(document.getElementById('sphone').value||'').replace(/\D/g,'');
    if(!/^5\d{8}$/.test(S._phone)){ setSheetBody(signinBody(1,true)); break; }
    setSheetBody(signinBody(2)); setTimeout(()=>{ const f=document.getElementById('otp0'); f&&f.focus(); },50); break; }
  case 'verify': { const code=[0,1,2,3].map(i=>document.getElementById('otp'+i).value).join('');
    if(!/^\d{4}$/.test(code)){ document.querySelectorAll('.otp input').forEach(i=>{ if(!i.value) i.style.borderColor='var(--danger)'; }); break; }
    S.user={name:S._name||(S.lang==='ar'?'لاعب':'Gamer'), phone:S._phone}; store.save(); closeSheet(); toast(t('welcome',{n:esc(S.user.name)}));
    if(S.route==='welcome') go('home'); else render(); break; }
  case 'signout': S.user=null; store.save(); render(); break;
  case 'install':
    if(PWA.prompt){ PWA.prompt.prompt(); PWA.prompt.userChoice.finally(()=>{ PWA.prompt=null; render(); }); }
    else openSheet(t('ios_t'), ['ios1','ios2','ios3'].map((k,i)=>`<div class="note" style="font-size:14px;color:#fff;align-items:flex-start"><span class="stepn">${i+1}</span><span>${t(k)}</span></div>`).join('')+`<button class="btn-line bigbtn" data-a="closesheet">${t('gotit')}</button>`);
    break;
  case 'setting': S.settings[v]=!S.settings[v]; render(); break;
  case 'closesheet': closeSheet(); break;
 }
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && sheetEl){ closeSheet(); } });
app.addEventListener('keydown', e=>{ const el=e.target; if((e.key==='Enter'||e.key===' ') && el.matches('.hotel[role=button]')){ e.preventDefault(); el.click(); } if(e.key==='Enter' && el.id==='promo'){ app.querySelector('[data-a=promo]').click(); } });
app.addEventListener('input', e=>{
 const el=e.target;
 if(el.id==='q'){ S.q=el.value; document.getElementById('results').innerHTML=homeResults(); document.querySelectorAll('.cats button').forEach(b=>b.classList.toggle('on', !S.q && b.dataset.v===S.cat)); }
 if(el.id==='promo'){ S.promoIn=el.value; if(S.promoErr){ S.promoErr=false; el.parentElement.classList.remove('bad'); const m=app.querySelector('.pmsg'); m&&m.remove(); } }
 if(el.id==='cno'){ const d=el.value.replace(/\D/g,'').slice(0,16); el.value=d.replace(/(.{4})/g,'$1 ').trim(); S.card.no=el.value; }
 if(el.id==='cexp'){ let d=el.value.replace(/\D/g,'').slice(0,4); if(d.length>2) d=d.slice(0,2)+'/'+d.slice(2); el.value=d; S.card.exp=d; }
 if(el.id==='ccvv'){ el.value=el.value.replace(/\D/g,'').slice(0,3); S.card.cvv=el.value; }
 if(el.id && el.id.startsWith('otp')){ el.value=el.value.replace(/\D/g,'').slice(0,1); el.style.borderColor=''; const n=document.getElementById('otp'+(+el.id.slice(3)+1)); if(el.value&&n) n.focus(); }
});
window.addEventListener('hashchange', ()=>{ const r=location.hash.slice(1); if(r && r!==S.route && SCREENS[r]) go(r); });

/* ---------- PWA ---------- */
const PWA = {prompt:null};
const inFrame = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
function canInstall(){ return !standalone() && !inFrame && (PWA.prompt || isIOS); }
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); PWA.prompt=e; if(S.route==='profile') render(); });
window.addEventListener('appinstalled', ()=>{ PWA.prompt=null; toast(t('installed')); if(S.route==='profile') render(); });
window.addEventListener('offline', ()=>toast(t('offline')));
if('serviceWorker' in navigator && !inFrame && /^https?:$/.test(location.protocol)){
 window.addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

/* ---------- boot ---------- */
store.load();
{ const r=location.hash.slice(1); if(r && SCREENS[r] && r!=='splash'){ S.route=r; if(['event','pack','dates','plan','pay'].includes(r)) S.stack=['home']; } }
if(S.route==='dates'){ const e=EV(); S.checkin=addDays(e.date,-1); S.checkout=addDays(e.date,1); }
if(S.route==='done' && !S.last) S.last=makeBooking();
app.setAttribute('dir', S.lang==='ar'?'rtl':'ltr'); document.body.classList.toggle('ar', S.lang==='ar'); document.documentElement.lang=S.lang;
document.getElementById('side').setAttribute('dir', S.lang==='ar'?'rtl':'ltr');
render();
if(S.route==='splash') setTimeout(()=>{ if(S.route==='splash' && !sheetEl) go('welcome'); }, 3200);
</script>
